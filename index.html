<html lang="ku" dir="rtl" id="mainHtml">

    <style>

        :root { --primary: #38bdf8; --accent: #fbbf24; --card-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans Arabic', sans-serif; margin: 0; padding-bottom: 50px; min-height: 100vh; color: #fff;
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(2, 6, 23, 0.85)), url('https://i.postimg.cc/qRzMnWFV/photo-2026-05-09-18-07-24.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .top-nav { display: flex; gap: 10px; padding: 15px 20px; position: fixed; width: 100%; top: 0; z-index: 1000; }
        [dir="rtl"] .top-nav { justify-content: flex-end; }
        [dir="ltr"] .top-nav { justify-content: flex-start; }
        .nav-btn { position: relative; cursor: pointer; background: rgba(56, 189, 248, 0.2); padding: 10px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid var(--glass-border); display: flex; align-items: center; }

        header { padding: 100px 20px 30px; text-align: center; }
        header h1 { font-size: 2.5rem; color: var(--primary); font-weight: 900; margin: 0; }
        .categories-container { position: sticky; top: 0; z-index: 100; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); padding: 15px 10px; overflow-x: auto; display: flex; gap: 12px; }
        .cat-btn { padding: 10px 25px; background: rgba(255,255,255,0.05); border-radius: 50px; cursor: pointer; border: 1px solid var(--glass-border); white-space: nowrap; color: #ccc; }
        .cat-btn.active { background: var(--primary); color: #000; font-weight: 700; border-color: var(--primary); }
        .food-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; }
        .food-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--glass-border); backdrop-filter: blur(5px); display: flex; flex-direction: column; position: relative; }
        .food-img { width: 100%; height: 140px; background-size: cover; background-position: center; }
        .food-info { padding: 15px; text-align: center; }
        .food-info h3 { font-size: 1rem; margin: 0 0 10px 0; min-height: 45px; }
        .price-tag { background: var(--accent); color: #000; padding: 5px 12px; border-radius: 12px; font-weight: 900; }
        .add-btn { position: absolute; top: 10px; background: var(--primary); color: #fff; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; z-index: 10; }
        [dir="rtl"] .add-btn { left: 10px; }
        [dir="ltr"] .add-btn { right: 10px; }
        #cart-panel { position: fixed; top: 0; width: 85%; height: 100%; background: #0f172a; z-index: 2000; transition: 0.4s ease; padding: 25px; display: flex; flex-direction: column; }
        [dir="rtl"] #cart-panel { right: -100%; }
        [dir="ltr"] #cart-panel { left: -100%; }
        [dir="rtl"] #cart-panel.open { right: 0; }
        [dir="ltr"] #cart-panel.open { left: 0; }
        #cart-list { flex-grow: 1; overflow-y: auto; margin: 20px 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 12px; }
        .clear-btn { width: 100%; padding: 15px; background: #ef4444; color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
